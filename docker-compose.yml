services:
  voxcanvas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxcanvas-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEXT_PUBLIC_SYNC_SERVER_URL=${NEXT_PUBLIC_SYNC_SERVER_URL:-http://localhost:4001}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - SYNC_PORT=4001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
